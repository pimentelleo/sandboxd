map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # The same-namespace ClusterIP name is resolved through the Pod's configured
    # cluster DNS search domain, so this does not assume a cluster.local suffix.
    location /v1/ {
        proxy_pass http://sandboxd-control-plane:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
