traefik:
  deployment:
    replicas: 2
  service:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-resource-group: ${INGRESS_RESOURCE_GROUP}
    spec:
      loadBalancerIP: ${INGRESS_PUBLIC_IP}
  providers:
    kubernetesIngress:
      publishedService:
        enabled: true
  ports:
    web:
      redirectTo:
        port: websecure
    websecure:
      tls:
        enabled: true
