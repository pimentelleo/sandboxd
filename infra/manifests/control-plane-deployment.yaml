apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandboxd-control-plane
  namespace: sandboxd-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sandboxd-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandboxd-control-plane
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sandboxd-control-plane
      automountServiceAccountToken: true
      securityContext:
        fsGroup: ${CONTROL_PLANE_RUN_AS_GROUP}
        runAsGroup: ${CONTROL_PLANE_RUN_AS_GROUP}
        runAsUser: ${CONTROL_PLANE_RUN_AS_USER}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandboxd
          image: ${CONTROL_PLANE_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
            - name: agent-auth
              containerPort: 9100
          env:
            - name: SANDBOXD_RUNTIME_LEASE_HOLDER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sandboxd-runtime-secrets
                  key: database-url
            - name: SANDBOXD_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: sandboxd-runtime-secrets
                  key: encryption-key
            - name: SANDBOXD_ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sandboxd-runtime-secrets
                  key: entra-client-secret
          envFrom:
            - configMapRef:
                name: sandboxd-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: runtime-data
              mountPath: /var/lib/sandboxd
            - name: runtime-logs
              mountPath: /var/log/sandboxd
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sandboxd-secrets
        - name: runtime-data
          emptyDir: {}
        - name: runtime-logs
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandboxd-control-plane
  namespace: sandboxd-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandboxd-control-plane
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sandboxd-control-plane
  namespace: sandboxd-system
spec:
  minReplicas: 2
  maxReplicas: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sandboxd-control-plane
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
