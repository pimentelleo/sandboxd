apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandboxd-console
  namespace: sandboxd-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sandboxd-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandboxd-console
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: ${CONSOLE_IMAGE}
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: runtime-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sandboxd-console
  namespace: sandboxd-system
spec:
  selector:
    app.kubernetes.io/name: sandboxd-console
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandboxd-console
  namespace: sandboxd-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandboxd-console
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sandboxd-console
  namespace: sandboxd-system
spec:
  minReplicas: 2
  maxReplicas: 6
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sandboxd-console
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandboxd-console
  namespace: sandboxd-system
  annotations:
    cert-manager.io/cluster-issuer: sandboxd-production
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["console.${ROOT_DOMAIN}"]
      secretName: sandboxd-console-tls
  rules:
    - host: "console.${ROOT_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sandboxd-console
                port:
                  name: http
