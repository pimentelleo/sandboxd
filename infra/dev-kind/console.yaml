apiVersion: v1
kind: Service
metadata:
  name: sandboxd-console
  namespace: sandboxd-system
  labels:
    app.kubernetes.io/name: sandboxd-console
    app.kubernetes.io/part-of: sandboxd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandboxd-console
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandboxd-console
  namespace: sandboxd-system
  labels:
    app.kubernetes.io/name: sandboxd-console
    app.kubernetes.io/part-of: sandboxd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandboxd-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandboxd-console
        app.kubernetes.io/part-of: sandboxd
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 101
        runAsUser: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: localhost/sandboxd-console:kind
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: runtime-tmp
          emptyDir: {}
