apiVersion: v1
kind: Namespace
metadata:
  name: sandboxd-system
  labels:
    app.kubernetes.io/part-of: sandboxd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandboxd-control-plane
  namespace: sandboxd-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandboxd-kind-runtime
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/exec
      - pods/log
      - services
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
    verbs: ["create", "delete", "get", "list", "patch", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["services", "resourcequotas", "limitranges"]
    verbs: ["update"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandboxd-kind-runtime
subjects:
  - kind: ServiceAccount
    name: sandboxd-control-plane
    namespace: sandboxd-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandboxd-kind-runtime
