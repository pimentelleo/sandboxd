apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandboxd-state
  namespace: sandboxd-system
  labels:
    app.kubernetes.io/part-of: sandboxd
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandboxd-kind-config
  namespace: sandboxd-system
data:
  SANDBOXD_ADDR: "0.0.0.0:9000"
  SANDBOXD_PLATFORM: "kubernetes-local"
  SANDBOXD_DB: "/var/lib/sandboxd/state/sandboxd.db"
  SANDBOXD_MIGRATIONS: "/usr/local/share/sandboxd/migrations"
  SANDBOXD_SECRETS_KEY_FILE: "/var/lib/sandboxd/state/secrets.key"
  SANDBOXD_API_AUTH_DISABLED: "false"
  SANDBOXD_AUTH_PROFILE: "local"
  SANDBOXD_LOCAL_AUTH_MODE: "accounts"
  SANDBOXD_CONTROL_PLANE_REPLICAS: "1"
  PREVIEW_DOMAIN: "localhost"
  PREVIEW_URL_SCHEME: "http"
  SANDBOXD_PUBLIC_HTTP_PORT: "9090"
  SANDBOXD_KUBERNETES_NAMESPACE_PREFIX: "sandboxd"
  SANDBOXD_KUBERNETES_STORAGE_CLASS: "standard"
  SANDBOXD_KUBERNETES_SANDBOX_IMAGE: "localhost/sandboxd-base:kind"
  SANDBOXD_KUBERNETES_RUNTIME_CLASS: ""
  SANDBOXD_KUBERNETES_WORKSPACE_MOUNT: "/home/sandbox"
  SANDBOXD_KUBERNETES_WEB_PORT: "3000"
  SANDBOXD_KUBERNETES_CLUSTER_DOMAIN: "cluster.local"
  SANDBOXD_KUBERNETES_REQUEST_CPU: "100m"
  SANDBOXD_KUBERNETES_REQUEST_MEMORY: "256Mi"
  SANDBOXD_KUBERNETES_LIMIT_CPU: "1"
  SANDBOXD_KUBERNETES_LIMIT_MEMORY: "1Gi"
  SANDBOXD_KUBERNETES_WORKSPACE_SIZE: "1Gi"
  SANDBOXD_AGENT_PROXY_URL: "http://sandboxd-control-plane.sandboxd-system.svc.cluster.local:9100"
  SANDBOXD_DEFAULT_AGENT: "opencode"
---
apiVersion: v1
kind: Service
metadata:
  name: sandboxd-control-plane
  namespace: sandboxd-system
  labels:
    app.kubernetes.io/name: sandboxd-control-plane
    app.kubernetes.io/part-of: sandboxd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandboxd-control-plane
  ports:
    - name: http
      port: 9000
      targetPort: http
    - name: agent-auth
      port: 9100
      targetPort: agent-auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandboxd-control-plane
  namespace: sandboxd-system
  labels:
    app.kubernetes.io/name: sandboxd-control-plane
    app.kubernetes.io/part-of: sandboxd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandboxd-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandboxd-control-plane
        app.kubernetes.io/part-of: sandboxd
    spec:
      serviceAccountName: sandboxd-control-plane
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandboxd
          image: localhost/sandboxd-control-plane:kind
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
            - name: agent-auth
              containerPort: 9100
          env:
            - name: SANDBOXD_RUNTIME_LEASE_HOLDER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          envFrom:
            - configMapRef:
                name: sandboxd-kind-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: state
              mountPath: /var/lib/sandboxd
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: sandboxd-state
        - name: runtime-tmp
          emptyDir: {}
